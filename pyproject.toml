[project]
name = "ogrl-integration"
version = "0.1.0a4"
description = "Write OGRL integrations: the protocol, an HTTP client, a test kit, and packaging (RFC 0005)."
license = "Apache-2.0"
authors = [
    { name = "David Hoenisch", email = "dh1689@pm.me" }
]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
cli = ["pyyaml>=6", "jsonschema>=4.23"]

[project.scripts]
ogrl-integration = "ogrl_integration.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15", "pyyaml>=6", "jsonschema>=4.23"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
